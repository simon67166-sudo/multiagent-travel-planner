<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>旅程编排 Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: #f3f3f0;
    color: #1a1a1a;
    height: 100vh;
    display: flex;
  }

  /* ---------- 左：实时日程 ---------- */
  #schedule {
    width: 42%;
    max-width: 520px;
    border-right: 1px solid #ddd;
    padding: 20px;
    overflow-y: auto;
    background: #fff;
  }
  #schedule h2 { margin-top: 0; font-size: 18px; }
  #schedule h3 { font-size: 14px; color: #666; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
  .empty-hint { color: #999; font-size: 13px; }

  .card { border: 1px solid #e5e5e0; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .card .title { font-weight: 600; }
  .card .meta { color: #777; margin-top: 2px; }

  .alert-card { background: #fff4e5; border-color: #f0c36d; }

  .day-block { margin-bottom: 16px; }
  .day-date { font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .stop {
    display: flex;
    gap: 8px;
    padding: 8px 10px;
    border-left: 3px solid #0b5d3b;
    background: #f7f7f4;
    border-radius: 4px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .stop.meal { border-left-color: #a6402b; }
  .stop .icon { flex: none; }
  .stop .place { font-weight: 600; }
  .stop .detail { color: #777; font-size: 12px; margin-top: 2px; }

  /* ---------- 右：聊天 ---------- */
  #chat { flex: 1; display: flex; flex-direction: column; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 70%; margin-bottom: 12px; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
  .msg.user { margin-left: auto; background: #0b5d3b; color: #fff; }
  .msg.assistant { margin-right: auto; background: #fff; border: 1px solid #e5e5e0; }
  .msg.pending { opacity: 0.6; }

  #input-bar { display: flex; gap: 8px; padding: 16px 20px; border-top: 1px solid #ddd; background: #fff; }
  #input-bar input {
    flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
  }
  #input-bar button {
    padding: 10px 20px; border: none; border-radius: 6px; background: #0b5d3b; color: #fff;
    font-size: 14px; cursor: pointer;
  }
  #input-bar button:disabled { background: #999; cursor: default; }
</style>
</head>
<body>

<div id="schedule">
  <h2>实时日程</h2>
  <div id="schedule-content"><p class="empty-hint">加载中…</p></div>
</div>

<div id="chat">
  <div id="messages"></div>
  <div id="input-bar">
    <input id="input" type="text" placeholder="跟编排 Agent 说点什么…" />
    <button id="send">发送</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const scheduleEl = document.getElementById("schedule-content");

function addMessage(role, text, pending) {
  const div = document.createElement("div");
  div.className = "msg " + role + (pending ? " pending" : "");
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function renderStop(stop) {
  const isMeal = stop.type === "meal";
  const label = isMeal ? (stop.meal_type || "餐饮") : "景点";
  return `
    <div class="stop ${isMeal ? "meal" : ""}">
      <div class="icon">${isMeal ? "🍜" : "📍"}</div>
      <div>
        <div class="place">${stop.place}（${label}）</div>
        <div class="detail">${stop.arrival_transport} 到达 · ${stop.arrival_time} - ${stop.end_time}</div>
      </div>
    </div>`;
}

function renderSchedule(trip) {
  let html = "";

  if (trip.flights && trip.flights.length) {
    html += "<h3>航班</h3>";
    trip.flights.forEach(f => {
      html += `<div class="card"><div class="title">${f.flight_no || ""} ${f.from_ || ""} → ${f.to || ""}</div>
        <div class="meta">${f.depart_time || ""} - ${f.arrive_time || ""} · ${f.status || ""}</div></div>`;
    });
  }

  if (trip.hotels && trip.hotels.length) {
    html += "<h3>酒店</h3>";
    trip.hotels.forEach(h => {
      html += `<div class="card"><div class="title">${h.name || ""}</div>
        <div class="meta">${h.check_in || ""} ~ ${h.check_out || ""} · ¥${h.price ?? "-"}</div></div>`;
    });
  }

  if (trip.weather_alerts && trip.weather_alerts.length) {
    html += "<h3>异常提醒</h3>";
    trip.weather_alerts.forEach(a => {
      html += `<div class="card alert-card"><div class="title">${a.event_type || ""} - ${a.location || ""}</div>
        <div class="meta">${a.description || ""}</div></div>`;
    });
  }

  html += "<h3>每日行程</h3>";
  if (!trip.days || !trip.days.length) {
    html += `<p class="empty-hint">还没有行程安排，去右边跟编排 Agent 聊聊吧。</p>`;
  } else {
    trip.days.forEach(day => {
      html += `<div class="day-block"><div class="day-date">${day.date}</div>`;
      if (!day.stops.length) {
        html += `<p class="empty-hint">这天暂无安排</p>`;
      } else {
        day.stops.forEach(stop => { html += renderStop(stop); });
      }
      html += `</div>`;
    });
  }

  scheduleEl.innerHTML = html;
}

async function refreshSchedule() {
  const res = await fetch("/trip");
  const trip = await res.json();
  renderSchedule(trip);
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  sendBtn.disabled = true;

  addMessage("user", text);
  const pendingEl = addMessage("assistant", "思考中…", true);

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    pendingEl.classList.remove("pending");
    pendingEl.textContent = data.chat_reply || data.error || "（没有回复）";
    await refreshSchedule();
  } catch (err) {
    pendingEl.classList.remove("pending");
    pendingEl.textContent = "请求失败：" + err;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

refreshSchedule();
</script>
</body>
</html>
